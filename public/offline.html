<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rafluo — Sem Conexão</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif;
        background-color: #24152F;
        color: #F7F1E5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #180D20;
        border: 1px solid #3F2553;
        border-radius: 24px;
        padding: 36px 28px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .icon-circle {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: #24152F;
        border: 1px solid #3F2553;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        color: #DFFF5F;
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        color: #F7F1E5;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 13px;
        color: #D2C4DC;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 13px 20px;
        background: #DFFF5F;
        color: #180D20;
        font-size: 13px;
        font-weight: 800;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        transition: transform 0.15s, background-color 0.15s;
        text-decoration: none;
      }
      .btn:active {
        transform: scale(0.98);
        background: #CEF04A;
      }
      .brand {
        margin-top: 24px;
        font-size: 11px;
        color: rgba(247, 241, 229, 0.4);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-circle">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Sem conexão com a internet</h1>
      <p>Você está offline no momento. Assim que a conexão for restabelecida, o Rafluo atualizará suas confirmações automaticamente.</p>
      <button class="btn" onclick="window.location.reload()">
        Tentar Novamente
      </button>
      <div class="brand">Rafluo • Gestão Inteligente de Confirmações</div>
    </div>
  </body>
</html>
