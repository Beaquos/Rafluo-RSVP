<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Ignore Vite HMR WebSocket connection errors in sandbox iframe environment -->
    <script>
      (function() {
        var isViteMsg = function(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || (typeof arg.toString === 'function' ? arg.toString() : ''));
          return str.indexOf('[vite]') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1;
        };
        var _err = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) return;
          }
          _err.apply(console, arguments);
        };
        var _warn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) return;
          }
          _warn.apply(console, arguments);
        };
        window.addEventListener('error', function(event) {
          if (event && (isViteMsg(event.message) || isViteMsg(event.error))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && isViteMsg(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#24152F" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rafluo" />
    <meta name="application-name" content="Rafluo" />

    <title>Rafluo — Gestão Inteligente de Confirmações</title>
    <meta name="description" content="Rafluo — Gestão inteligente de confirmações de presença. Desenvolvido com carinho por Beaquos Estúdio Criativo." />
    
    <!-- Open Graph for WhatsApp & Social Sharing -->
    <meta property="og:title" content="Rafluo — Gestão Inteligente de Confirmações" />
    <meta property="og:description" content="Rafluo — Gestão inteligente de confirmações de presença. Desenvolvido com carinho por Beaquos Estúdio Criativo." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet" />

    <!-- Anti-flash theme script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('rafluo_theme_mode');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'auto' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#180D20');
          } else {
            document.documentElement.classList.remove('dark');
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#24152F');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF6EE] text-[#24152F] antialiased selection:bg-[#DFFF5F] selection:text-[#180D20]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
